<!doctype html>
<html lang="en" style="background:#0b0d10">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area insets in web/ui/ui.css: the page runs under the home
     indicator at the bottom, and env(safe-area-inset-bottom) keeps the composer off it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ghostfleet</title>
<meta name="theme-color" content="#0b0d10">
<!-- THE GROUND IS PAINTED BEFORE ANYTHING IS FETCHED. Going back could show a fully white
     screen until the page came up: a document's first frame is drawn before app.css has
     arrived (phone.css now), and until then the canvas is the browser's LIGHT default — as is the web view
     behind it, which is what the system back gesture slides in when it has no snapshot of
     the screen it is returning to. So the colour is inline, on <html> and in this block,
     and `color-scheme: dark` makes the UA's own defaults (canvas, the view under the page,
     form controls before styling) dark too. The value is --bg's, and phone.css restates it. -->
<meta name="color-scheme" content="dark">
<style>html,body{background:#0b0d10;color-scheme:dark;margin:0}</style>
<!-- iOS installs from these two, not from the manifest (16.4+ reads the manifest for
     display/scope but still wants the apple-touch-icon). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- `black`, NOT `black-translucent`, and the difference is the bottom of the screen. With a
     translucent bar, iOS 26 standalone puts the web view at the top of the screen (under the
     bar, so env(safe-area-inset-top) reads 53) but sizes it to the screen MINUS the bar
     (innerHeight 759 on an 812 screen) — the bottom 53pt belong to no page and no CSS reaches
     them. Measured four launches running: sized by dvh, pinned with inset: 0, then laid out
     to 812 — the band stayed and the composer was cut off above it, because a box laid out
     past the web view is not painted. WebKit bug 301108 (rdar://163501215). Apple's meta-tag
     reference says which half fixes it: "If set to default or black, the web content is
     displayed below the status bar" — iOS keeps the strip it was already keeping, and the
     web view runs to the real bottom edge. `black` over `default` because this app is
     #0b0d10 in every theme and a default bar can come back white.
       iOS STORES this value in the web clip and lays out from the STORED one: measured on an
     iOS 26.5 simulator, one clip, one page, only the meta changed between launches — the
     launch that served `black-translucent` still laid out opaque (sat0), the next launch laid
     out translucent (sat62, band), and the clip's Info.plist on disk had been rewritten to
     the value the page carried. So a change here lands one launch LATE: the first open after
     the update reads it, the next open (quit the app first — a resume is not a launch) uses
     it. Removing and re-adding the icon does the same in one step. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ghostfleet">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="manifest" href="./manifest.webmanifest">
<!-- The faces web/ui is drawn in (Inter, JetBrains Mono, and Silkscreen for the wordmark),
     vendored under web/fonts with their licences: the team app gets them from npm, and a phone
     that is offline still has to draw its own name. -->
<link rel="stylesheet" href="./fonts/fonts.css">
<!-- The screens' rules: web/ui's and brand/'s tokens, bundled by vite.config.mjs. -->
<link rel="stylesheet" href="./phone.css">
<!-- The terminal's own rules (web/xterm.css, vendored with xterm.js — scripts/vendor-xterm.sh).
     Loaded with the shell rather than with the terminal, because it is 7 kB and a stylesheet
     injected later would be a <link> the CSP and the precache list both have to know about. -->
<link rel="stylesheet" href="./xterm.css">
</head>
<body>
<!-- Everything below is drawn by phone.js: the same app as the team's (web/ui), behind the
     passkey lock. The static shell is deliberately this small: it is what the service worker
     serves on a cold offline open, before any state. -->
<div id="app"></div>
<script type="module" src="./phone.js"></script>
<noscript>ghostfleet needs JavaScript: the grid is computed, not a page.</noscript>
</body>
</html>
