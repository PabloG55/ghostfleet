name: test

# The suite is the only thing standing between this repo and the class of bug it
# exists to catch — silent ones, where the code keeps running and answers wrong.
# Until now it ran when somebody remembered. Now it runs on every push to main and
# every pull request, on both supported platforms.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Not fail-fast: the two legs are the point. macOS is where this is developed
      # and Linux is where the macOS-only guards (stat -f, date -r, osascript,
      # caffeinate) are actually proven — cancelling one because the other went red
      # would throw away exactly the half that was telling us something new.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Not a skip: the ^N assertion still runs and still proves what it is for.
      # bin/fleet-tab defaults the editor to nvim and correctly REFUSES when it is
      # absent, which is what neither runner image has — so the grid emits no choice
      # and the test reads empty. CLAUDE_FLEET_EDITOR is the product's own documented
      # override for exactly this, and vi is on both images. Checked in both
      # directions on a Mac with tmux 3.7b: with the editor missing the assertion is
      # red with an empty `got`, matching CI exactly; with this set it is green.
      CLAUDE_FLEET_EDITOR: vi

    # Local wall clock is ~4m30s, nearly all of it waiting on tmux and daemon settles
    # rather than burning CPU. A hung tmux server would otherwise sit on the runner's
    # 6-hour default; this fails it in a readable amount of time instead.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # THE CLONE ABOVE IS SHALLOW and fetches only the ref under test — no fetch-depth is
      # set, so it is depth 1 and there is no `origin/main` in it at all. Measured against a
      # real `git clone --depth=1 --single-branch`: `git rev-parse origin/main` fails, and so
      # does every comparison built on it.
      #   test/helpers/sw-version.mjs needs it, because the thing it checks is ORDER: this
      # branch's client VERSION against the one already on main. #83 took v17, #81 was
      # numbered v16 before it and merged after, main went backwards, and #84 existed only to
      # put it back. The pin in pwa-check cannot see that — a version bumped DOWNWARDS still
      # matches its own bytes.
      #   ONE REF, ONE COMMIT DEEP. That is all the check reads (main's web/sw.js and whether
      # HEAD is already contained in it), and it keeps this step at a few hundred milliseconds
      # instead of unshallowing the whole history.
      #   `|| true` and NOT a hard failure here, deliberately: if the ref does not arrive, the
      # helper is the thing that refuses — on a pull_request run it FAILS, in a readable
      # sentence, rather than skipping. A guard that silently no-ops in CI reads as covered
      # and is worse than no guard. Letting the fetch kill the job would replace that sentence
      # with a git error, and on the push-to-main leg there is nothing to compare anyway.
      - name: Fetch main, for the client-version ordering check
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main || true

      # tmux is on neither runner image; jq is on both today, and that is not a
      # promise. Both are installed rather than assumed. No npm step: the suite has
      # no dependencies and the repo has no lockfile.
      - name: Install tmux and jq (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq

      - name: Install tmux and jq (macOS)
        if: runner.os == 'macOS'
        run: |
          for p in tmux jq; do
            brew list --formula "$p" >/dev/null 2>&1 || brew install "$p"
          done

      # package.json says node >=18. The runner images ship one, but which one drifts,
      # and a suite that fails because an image moved should not read as a code bug.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A platform difference in the suite shows up as a red assertion that never
      # mentions the platform. These four lines are what makes such a leg diagnosable.
      #
      # `tmux -V` earned its place: this leg opened with 125 failures that were not about
      # Linux at all. Ubuntu 24.04's apt tmux is 3.4 and Homebrew's is 3.7b, and tmux
      # <= 3.5 vis-escapes command output, which broke every `-F` record ghostfleet
      # parsed. Put tmux 3.4 on a Mac's PATH and the same suite fails the same way. So
      # read this line FIRST when a leg is red and the other one is green — and do not
      # "fix" a red leg by installing a newer tmux here: a stock distro tmux is the
      # thing being tested.
      - name: Versions
        run: |
          bash --version | head -1
          node --version
          tmux -V
          jq --version

      # No isolation needed beyond what the suite already does: it puts every tmux
      # server it starts under its own per-run $TMUX_TMPDIR and sweeps the leftovers
      # of runs that died before their teardown (test/run.sh §0), which is why two
      # runs can share a machine. A CI runner is the easy case of that.
      - name: ./test/run.sh
        run: ./test/run.sh

  # ── the half CI cannot do, said honestly ────────────────────────────────────
  # The job above proves the COMMIT. The thing that actually broke was not the commit:
  # four PRs merged, nobody ran cf-sync, and ~/.local/libexec/ghostfleet went on serving
  # the pre-fix bin/ for about an hour while the repo was current — invisible on macOS,
  # and on tmux <= 3.5 it IS the bug #68 had just fixed. That state lives on a developer's
  # disk. Nothing here can see it, reach it, or verify it, and a step that implied
  # otherwise would be worse than no step: green would start meaning "deployed".
  #
  # So this writes a REMINDER and nothing else. It never fails the build (a merged, tested
  # commit is not broken because a laptop has not caught up), it makes no claim about any
  # machine, and it names the commit so the sync you run can be checked against it. The
  # real check is local and lives in bin/ghostfleet, which compares <runtime>/.synced with
  # the source repo's HEAD every time the Projects screen is drawn.
  #
  # A job summary rather than a PR comment, deliberately: this fires on push to main, where
  # the pull request is already closed — a comment would arrive after the fact on a thread
  # nobody is reading, notify every participant about a chore on someone else's laptop, and
  # need `pull-requests: write` on a workflow that currently needs no permissions at all.
  # The summary is attached to the run you are already looking at when you check the merge.
  #
  # needs: test, so a red suite produces no reminder — being told to deploy a commit whose
  # suite just failed is the one thing this must not say. It is also why this is a separate
  # job and not a step in the matrix: as a step it would run once per OS leg and write the
  # same paragraph twice.
  sync-reminder:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Remind that the runtime is a separate thing
        # The subject arrives through the environment, not through ${{ }} inside the script:
        # a commit message is attacker-controlled text and interpolating it into a shell
        # line is how that becomes code. No checkout needed either — the push payload
        # already carries everything this says.
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          short="${GITHUB_SHA:0:12}"
          subject="${SUBJECT%%$'\n'*}"
          {
            printf '### `main` moved — the runtime has not\n\n'
            printf 'Merged **`%s`** — %s\n\n' "$short" "$subject"
            printf 'The code that actually executes is the staged copy at `~/.local/libexec/ghostfleet`, not the repo. On every machine running a fleet:\n\n'
            printf '```bash\ncf-sync\n```\n\n'
            printf 'CI cannot check that — the merge happened here, the staleness is on your disk. `bin/ghostfleet` does: it compares `<runtime>/.synced` against the source repo'"'"'s HEAD on the Projects screen and says how far behind it is. `ghostfleet --sync-check` asks the same question from a script.\n'
          } >> "$GITHUB_STEP_SUMMARY"
