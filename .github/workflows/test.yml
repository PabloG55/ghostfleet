name: test

# The suite is the only thing standing between this repo and the class of bug it
# exists to catch — silent ones, where the code keeps running and answers wrong.
# Until now it ran when somebody remembered. Now it runs on every push to an
# integration branch and every pull request, on both supported platforms.
#
# BOTH BRANCHES, because a green PR does not prove a green branch. Required checks
# are deliberately not `strict` (a PR does not have to be rebased onto the tip before
# it merges), which is what lets a fleet of parallel workers land without serialising
# behind each other — and the price of that is exactly this: two PRs can each be green
# against an older `staging` and break it together. The pull_request run proves the
# merge; this push run proves the result. Without it the window between "each PR was
# green" and "somebody notices" is however long it takes a human to look.
on:
  push:
    branches: [main, staging]
  # NOT `edited`. A body edit used to fire a second run of THIS workflow on the same commit
  # with the test job skipped, and a skipped matrix job reports ONE check called plain
  # `test` rather than one per leg. GitHub then reads the required `test (ubuntu-latest)`
  # and `test (macos-latest)` from that newest suite, finds neither, and holds the PR
  # BLOCKED with every required check green — measured twice; re-running the real run did
  # not clear it, only a new commit did. So an edit never reaches this workflow: the check
  # that has something to say about an edit lives in pr-text.yml, which is its own suite.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ── the suite, as shards ────────────────────────────────────────────────────
  # suite-shard.yml runs one platform's suite as N parallel slices. One call per platform, so
  # that each platform's verdict below can need its own shards and nothing else.
  shards-ubuntu:
    name: shards (ubuntu-latest)
    uses: ./.github/workflows/suite-shard.yml
    with:
      os: ubuntu-latest

  shards-macos:
    name: shards (macos-latest)
    uses: ./.github/workflows/suite-shard.yml
    with:
      os: macos-latest

  # ── the checks branch protection requires ───────────────────────────────────
  # Protection requires `test (ubuntu-latest)` and `test (macos-latest)`, the names the old
  # one-job-per-platform matrix reported. These two jobs carry those names and stand for their
  # platform's shards; protection is unchanged.
  #   if: always(), AND THAT IS LOAD-BEARING. Without it a failed shard SKIPS the job that
  # needs it, and GitHub counts a skipped required check as passed — a red shard would merge.
  # With it the job always runs and test/helpers/shard-verdict.sh decides: red unless the
  # shards' result is `success` (so failure, cancelled and skipped are all red) and every
  # shard's record shows the groups the plan gave it, each run exactly once. It lists each
  # shard's own conclusion first, so a red here names the shard to open.
  #   actions: read is for that listing only (the run's own jobs); the verdict does not
  # depend on it.
  test-ubuntu:
    name: test (ubuntu-latest)
    needs: shards-ubuntu
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # continue-on-error: no record at all is the verdict's to report, by shard, not a
      # download error's.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: groups-run-ubuntu-latest-*
          path: ${{ runner.temp }}/ran
      - name: Every shard passed, and together they ran every group once
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.shards-ubuntu.result }}
        run: test/helpers/shard-verdict.sh ubuntu-latest "$RESULT" "$RUNNER_TEMP/ran"

  test-macos:
    name: test (macos-latest)
    needs: shards-macos
    if: always()
    # The verdict reads records and a job list; it does not need a Mac, and a Mac runner is
    # the scarce one (five at a time on this plan, and four are already the shards).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # continue-on-error: no record at all is the verdict's to report, by shard, not a
      # download error's.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: groups-run-macos-latest-*
          path: ${{ runner.temp }}/ran
      - name: Every shard passed, and together they ran every group once
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.shards-macos.result }}
        run: test/helpers/shard-verdict.sh macos-latest "$RESULT" "$RUNNER_TEMP/ran"

  # ── the half CI cannot do, said honestly ────────────────────────────────────
  # The job above proves the COMMIT. The thing that actually broke was not the commit:
  # four PRs merged, nobody ran cf-sync, and ~/.local/libexec/ghostfleet went on serving
  # the pre-fix bin/ for about an hour while the repo was current — invisible on macOS,
  # and on tmux <= 3.5 it IS the bug #68 had just fixed. That state lives on a developer's
  # disk. Nothing here can see it, reach it, or verify it, and a step that implied
  # otherwise would be worse than no step: green would start meaning "deployed".
  #
  # So this writes a REMINDER and nothing else. It never fails the build (a merged, tested
  # commit is not broken because a laptop has not caught up), it makes no claim about any
  # machine, and it names the commit so the sync you run can be checked against it. The
  # real check is local and lives in bin/ghostfleet, which compares <runtime>/.synced with
  # the source repo's HEAD every time the Projects screen is drawn.
  #
  # A job summary rather than a PR comment, deliberately: this fires on push to main, where
  # the pull request is already closed — a comment would arrive after the fact on a thread
  # nobody is reading, notify every participant about a chore on someone else's laptop, and
  # need `pull-requests: write` on a workflow that otherwise only ever reads.
  # The summary is attached to the run you are already looking at when you check the merge.
  #
  # needs: both platforms' verdicts, so a red suite produces no reminder — being told to
  # deploy a commit whose suite just failed is the one thing this must not say. It is also why
  # this is a separate job and not a step in a shard: there it would run once per shard and
  # write the same paragraph eight times.
  #
  # ON STAGING TOO, since `main` became publishable-only. Day-to-day merges land on
  # `staging`, so that is the push that leaves a runtime stale; a reminder that fired
  # only on `main` would go quiet for everything except releases — which is precisely
  # when it is least needed, because a release is already a moment somebody is paying
  # attention. The branch is named in the summary so the two cannot be confused.
  sync-reminder:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    needs: [test-ubuntu, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Remind that the runtime is a separate thing
        # The subject arrives through the environment, not through ${{ }} inside the script:
        # a commit message is attacker-controlled text and interpolating it into a shell
        # line is how that becomes code. No checkout needed either — the push payload
        # already carries everything this says.
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          short="${GITHUB_SHA:0:12}"
          subject="${SUBJECT%%$'\n'*}"
          {
            printf '### `%s` moved — the runtime has not\n\n' "$GITHUB_REF_NAME"
            printf 'Merged **`%s`** — %s\n\n' "$short" "$subject"
            printf 'The code that actually executes is the staged copy at `~/.local/libexec/ghostfleet`, not the repo. On every machine running a fleet:\n\n'
            printf '```bash\ncf-sync\n```\n\n'
            printf 'CI cannot check that — the merge happened here, the staleness is on your disk. `bin/ghostfleet` does: it compares `<runtime>/.synced` against the source repo'"'"'s HEAD on the Projects screen and says how far behind it is. `ghostfleet --sync-check` asks the same question from a script.\n'
          } >> "$GITHUB_STEP_SUMMARY"
