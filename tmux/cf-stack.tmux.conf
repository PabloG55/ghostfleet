# cf-stack.tmux.conf — the config for the STACK server, and deliberately NOT
# tmux/cf.tmux.conf.
#
# The stack is a THIRD multiplexer level:
#
#     zellij  ->  THIS tmux  ->  each project's fleet tmux  ->  the agent
#
# Whichever layer sees a key first wins, and this one sits OUTSIDE the fleet's own
# server — so every key bound here is a key the fleet inside never receives, and one
# Claude never receives either. cf.tmux.conf binds `, C-s, C-p, ⇧←/→ and C-f with -n
# (no prefix); loading it here would mean the stack, not the fleet, answered all of
# them. So this file binds three keys, and explains the ones it refuses to.
#
#   prefix  None    C-a stays the FLEET's prefix. That keeps C-a g / d / s / p and the
#                   C-a C-a literal-escape working inside a stack pane, which is the
#                   whole reason not to give this server a prefix of its own. (C-b, the
#                   tmux default, is NOT free: Claude Code uses it to move the cursor
#                   back one character — measured.)
#   `               cf.tmux.conf already takes ` with -n, so Claude loses nothing new
#                   here, and "one level back" from inside the stack means "leave the
#                   stack" — which is exactly what this does. Left unbound, ` would
#                   reach the fleet server instead and detach only that ONE nested
#                   client, closing its pane and leaving the rest.
#   ⇧← / ⇧→         MOVE FOCUS between stack panes. Without this the stack was
#                   read-only for every pane but the first: `prefix None` puts pane
#                   navigation out of reach (tmux ships it ONLY in the prefix table),
#                   and the mouse could not focus either while `mouse off` suppressed
#                   the Mouse* bindings. Focus therefore sat on pane 0, where
#                   fleet-stack's select-pane left it, for the life of the stack: you
#                   could watch the other panes and never type in them.
#
#                   Why these keys, given they are the one pair the fleet ALSO binds
#                   with -n: nothing is actually lost. cf.tmux.conf binds the same
#                   session cycle to C-a ←/→ in its PREFIX table, which still passes
#                   through (see prefix None above). So inside a stack, ⇧←→ moves
#                   between panes and C-a ←/→ cycles which session a pane shows. The
#                   alternatives were worse: C-s/C-t/C-p/C-f already belong to the
#                   fleet and detach (which closes the pane), and Alt+arrows depend on
#                   the terminal sending Option as Meta — shift-arrows don't, and the
#                   fleet's own ⇧←→ binding already proves they arrive.
#
#                   `-t :.+`/`:.-`, not `-L`/`-R`: the layout is always
#                   even-horizontal, so pane index order IS left-to-right order, and
#                   the index form WRAPS at both ends — matching the fleet's ⇧←→
#                   session ring instead of dead-ending on the edge pane.
#   mouse   on      A CLICK focuses the pane you clicked, and still reaches the agent
#                   in it. This was `off` first, on the theory that an outer tmux
#                   claiming the mouse would swallow every event before the fleet —
#                   and Claude — saw it. Measured on tmux 3.7b in the real three-level
#                   nest (synthetic SGR events fed to a live client), that theory is
#                   wrong in both halves:
#
#                     - `off` never stopped the event reaching the agent. tmux routes a
#                       mouse sequence to the pane UNDER THE CURSOR and translates the
#                       coordinates for it (a click at column 150 arrived in pane 2, at
#                       offset 134, reporting column 16) — because it propagates a
#                       pane's own mouse request outward. What `off` suppressed was
#                       only tmux's Mouse* BINDINGS, i.e. the select-pane. So a click
#                       in an unfocused stack pane already reached that pane's Claude
#                       while the keyboard stayed behind: the worst of both.
#                     - `on` swallows nothing. tmux's default `MouseDown1Pane` is
#                       `select-pane -t = ; send-keys -M` — it forwards after focusing,
#                       and the forwarded bytes are byte-identical to the `off` case.
#                       Drag and wheel forward too, whenever the pane's app requested
#                       mouse tracking (`mouse_any_flag`), which a nested tmux always
#                       has: verified the wheel does NOT drop this outer tmux into
#                       copy-mode, the classic nested-tmux scroll trap.
#
#                   Nothing new is required of zellij at level 1 either: with `off` the
#                   event already had to pass through it to reach the agent, so this
#                   only changes what the stack does with an event it already got.
#   status  off     Every nested session draws its OWN status bar inside its pane; a
#                   bar here would be a fourth one. The pane BORDER carries the label
#                   instead, because every project has a session called `master` and a
#                   nested bar reading "● master" cannot say whose master it is.
#
# A changed binding here applies to the NEXT stack you open, not a running one: the
# stack server is created per open and killed on the way out (close_stack), so unlike
# a fleet server there is no long-lived server holding a stale config.
#
# Everything else — C-s, C-p, ⇧←/→, C-f, C-a … — passes straight through to the fleet
# server hosting that pane. Note what that means: C-s/C-p/C-f inside a stack pane do
# what they always do (write a .goto marker and detach), which here closes that pane.
# The marker is harmless — every path that reads one clears it first.
set -g prefix None
bind -n '`' detach-client
bind -n S-Right select-pane -t ':.+'
bind -n S-Left  select-pane -t ':.-'

set -g status off
set -g mouse on
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour148"

# Match the fleet's terminal handling. escape-time especially: nested tmux plus an
# agent that uses Esc makes a slow escape timeout feel like dropped keys.
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g focus-events on

# A nested client resizes its target, so the stack must not ALSO be the thing that
# decides a member's size twice over. Sized to the largest attached client, same as
# the fleet servers (see bin/fleet-stack).
set -g window-size largest

# A pane whose nested attach exits is a session you detached from or that ended —
# close the pane rather than leaving a dead frame in the layout.
set -g remain-on-exit off
