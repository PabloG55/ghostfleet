# cf-stack.tmux.conf — the config for the STACK server, and deliberately NOT
# tmux/cf.tmux.conf.
#
# The stack is a THIRD multiplexer level:
#
#     zellij  ->  THIS tmux  ->  each project's fleet tmux  ->  the agent
#
# Whichever layer sees a key first wins, and this one sits OUTSIDE the fleet's own
# server — so every key bound here is a key the fleet inside never receives, and one
# Claude never receives either. cf.tmux.conf binds `, C-s, C-p, ⇧←/→ and C-f with -n
# (no prefix); loading it here would mean the stack, not the fleet, answered all of
# them. So this file binds exactly one key, and explains the ones it refuses to.
#
#   prefix  None    C-a stays the FLEET's prefix. That keeps C-a g / d / s / p and the
#                   C-a C-a literal-escape working inside a stack pane, which is the
#                   whole reason not to give this server a prefix of its own. (C-b, the
#                   tmux default, is NOT free: Claude Code uses it to move the cursor
#                   back one character — measured.)
#   `               The one binding. cf.tmux.conf already takes ` with -n, so Claude
#                   loses nothing new here, and "one level back" from inside the stack
#                   means "leave the stack" — which is exactly what this does. Left
#                   unbound, ` would reach the fleet server instead and detach only
#                   that ONE nested client, closing its pane and leaving the rest.
#   mouse   off     cf.tmux.conf sets `mouse on`. An outer tmux that also claimed the
#                   mouse would swallow every event before the fleet — and Claude —
#                   saw it. Off here means the events pass through.
#   status  off     Every nested session draws its OWN status bar inside its pane; a
#                   bar here would be a fourth one. The pane BORDER carries the label
#                   instead, because every project has a session called `master` and a
#                   nested bar reading "● master" cannot say whose master it is.
#
# Everything else — C-s, C-p, ⇧←/→, C-f, C-a … — passes straight through to the fleet
# server hosting that pane. Note what that means: C-s/C-p/C-f inside a stack pane do
# what they always do (write a .goto marker and detach), which here closes that pane.
# The marker is harmless — every path that reads one clears it first.
set -g prefix None
bind -n '`' detach-client

set -g status off
set -g mouse off
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=colour240"
set -g pane-active-border-style "fg=colour148"

# Match the fleet's terminal handling. escape-time especially: nested tmux plus an
# agent that uses Esc makes a slow escape timeout feel like dropped keys.
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g focus-events on

# A nested client resizes its target, so the stack must not ALSO be the thing that
# decides a member's size twice over. Sized to the largest attached client, same as
# the fleet servers (see bin/fleet-stack).
set -g window-size largest

# A pane whose nested attach exits is a session you detached from or that ended —
# close the pane rather than leaving a dead frame in the layout.
set -g remain-on-exit off
