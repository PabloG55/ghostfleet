# claude-fleet tmux config — used for the per-zellij-session `cf-*` sockets.
# tmux is the hidden substrate that keeps each Claude session alive in the
# background; the claude-fleet grid is the front-end. This runs NESTED inside a
# zellij pane, so keep bindings clear of zellij's (C-g/p/t/n/h/s/o/q + Alt-n/f).

# Prefix on C-a (zellij doesn't grab it). C-a C-a sends a literal C-a to the app.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Step back one level = detach the client (the session keeps running). From
# master that's back to Projects; from a worker it's back to the sessions grid.
#   `      one-key back (no prefix)        <-- fastest
#   C-a g  (mnemonic: Grid)  /  C-a d      <-- fallback
# NOTE: the no-prefix backtick means you can't type a literal ` inside a session
# while attached. Comment the next line out (and use C-a g) if that bothers you.
bind -n '`' detach-client
bind g detach-client
bind d detach-client

# Jump to the sessions grid. Drops a "<socket>.goto" marker that the claude-fleet
# loop reads on detach (see enter_master in bin/claude-fleet), then detaches. (In a
# worker it just acts like a plain back.)
#   C-s    one chord, no prefix        <-- fastest
#   C-a s  (fallback / mnemonic)
# C-s only reaches tmux because the fleet zellij layout unbinds zellij's own Ctrl-s
# (scroll mode) — see layouts/fleet.kdl. If you launch outside that layout, use C-a s.
bind -n C-s run-shell 'printf grid > "#{socket_path}.goto"' \; detach-client
bind s run-shell 'printf grid > "#{socket_path}.goto"' \; detach-client

# C-p (no prefix) -> jump all the way up to PROJECTS from anywhere: master or an
# active chat. Drops a "projects" marker the claude-fleet loop reads on detach
# (enter_master + grid_loop both check it), then detaches — the session keeps running.
# NB: like the backtick binding, this takes C-p away from Claude inside a session.
bind -n C-p run-shell 'printf projects > "#{socket_path}.goto"' \; detach-client
bind p run-shell 'printf projects > "#{socket_path}.goto"' \; detach-client

# INSTA-JUMP, from master or any chat (numbers are printed on the cards):
#   C-f <digit>     -> that project's MASTER  (the lead — "go talk to project N")
#   C-f s <digit>   -> that project's session GRID ("s" as in ^S = sessions); a bare
#                      digit there then attaches, so C-f s 2 3 = project 2, session 3
# C-f enters a one-shot key table, so the digit is never sent to Claude. Same via the
# prefix (C-a f <digit>) if C-f is taken by something else.
bind -n C-f switch-client -T cfjump
bind    f   switch-client -T cfjump
bind -T cfjump 1 run-shell 'printf jumpm:1 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 2 run-shell 'printf jumpm:2 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 3 run-shell 'printf jumpm:3 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 4 run-shell 'printf jumpm:4 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 5 run-shell 'printf jumpm:5 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 6 run-shell 'printf jumpm:6 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 7 run-shell 'printf jumpm:7 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 8 run-shell 'printf jumpm:8 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump 9 run-shell 'printf jumpm:9 > "#{socket_path}.goto"' \; detach-client
bind -T cfjump p run-shell 'printf projects > "#{socket_path}.goto"' \; detach-client
bind -T cfjump s switch-client -T cfjumpg
bind -T cfjump Escape switch-client -T root
bind -T cfjumpg 1 run-shell 'printf jump:1 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 2 run-shell 'printf jump:2 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 3 run-shell 'printf jump:3 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 4 run-shell 'printf jump:4 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 5 run-shell 'printf jump:5 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 6 run-shell 'printf jump:6 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 7 run-shell 'printf jump:7 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 8 run-shell 'printf jump:8 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 9 run-shell 'printf jump:9 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg Escape switch-client -T root

# Always-visible reminder of how to get back to the grid (this is the one thing
# that isn't obvious once you're inside a session). Renders at the bottom of the
# pane, above zellij's own bar.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour236,fg=colour252"
set -g status-left "#[bg=colour148,fg=colour16,bold] ● #S #[bg=colour236,fg=colour148,nobold]▏"
set -g status-left-length 60
# master shows the Ctrl-s / ` shortcuts; workers show the plain back hint.
# (Styles use one attribute per #[...] — a comma inside #[...] would be parsed as
# a #{?...} argument separator and split the conditional.)
set -g status-right "#{?#{==:#S,master},#[fg=colour252]#[bold]Ctrl-s#[fg=colour246]#[nobold] sessions   #[fg=colour252]#[bold]\`#[fg=colour246]#[nobold] back to #[fg=colour148]#[bold]Projects  ,#[fg=colour246]press #[fg=colour252]#[bold]\`#[fg=colour246]#[nobold] (or #[fg=colour252]#[bold]Ctrl-a g#[fg=colour246]#[nobold]) to go back to the #[fg=colour148]#[bold]fleet grid  }"
set -g status-right-length 80
set -g window-status-format ""
set -g window-status-current-format ""

# Behave well nested + with Claude/vim.
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"     # truecolor passthrough (zellij -> tmux -> claude)
setw -g aggressive-resize on

# Keep sessions when you detach; only close a session when its process exits.
set -g destroy-unattached off
set -g remain-on-exit off
