# ghostfleet tmux config — used for the per-zellij-session `cf-*` sockets.
# tmux is the hidden substrate that keeps each Claude session alive in the
# background; the ghostfleet grid is the front-end. This runs NESTED inside a
# zellij pane, so keep bindings clear of zellij's (C-g/p/t/n/h/s/o/q + Alt-n/f).

# Prefix on C-a (zellij doesn't grab it). C-a C-a sends a literal C-a to the app.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Step back one level = detach the client (the session keeps running). From
# master that's back to Projects; from a worker it's back to the sessions grid.
#   `      one-key back (no prefix)        <-- fastest
#   C-a g  (mnemonic: Grid)  /  C-a d      <-- fallback
# NOTE: the no-prefix backtick means you can't type a literal ` inside a session
# while attached. Comment the next line out (and use C-a g) if that bothers you.
# FROM A TAB, "back" MEANS THE SESSION YOU CAME FROM. A tab is opened out of a chat
# (C-t/C-n), so detaching from one throws you up to the grid — one level further than
# you asked for, and you then have to find your way back down to the session you were
# in two keystrokes ago. @cf_tab_from is set by fleet-tab on the tab session only, so
# `if-shell -F` sends every OTHER session down the plain detach-client path it always
# had — unchanged, and with no subprocess.
#   The dead-origin case is why this is a script and not a nested tmux conditional:
# switch-client to a session that has since been closed leaves you nowhere, so
# fleet-tab falls back to detaching.
bind -n '`' if-shell -F '#{@cf_tab_from}' \
  'run-shell "#{?#{@cf_bin},#{@cf_bin}/,}fleet-tab back \"#{socket_path}\" \"#{session_name}\" \"#{client_tty}\""' \
  'detach-client'
bind g if-shell -F '#{@cf_tab_from}' \
  'run-shell "#{?#{@cf_bin},#{@cf_bin}/,}fleet-tab back \"#{socket_path}\" \"#{session_name}\" \"#{client_tty}\""' \
  'detach-client'
bind d detach-client

# Jump to the sessions grid. Drops a "<socket>.goto" marker that the ghostfleet
# loop reads on detach (see enter_master in bin/ghostfleet), then detaches. (In a
# worker it just acts like a plain back.)
#   C-s    one chord, no prefix        <-- fastest
#   C-a s  (fallback / mnemonic)
# C-s only reaches tmux because the fleet zellij layout unbinds zellij's own Ctrl-s
# (scroll mode) — see layouts/fleet.kdl. If you launch outside that layout, use C-a s.
bind -n C-s run-shell 'printf grid > "#{socket_path}.goto"' \; detach-client
bind s run-shell 'printf grid > "#{socket_path}.goto"' \; detach-client

# C-x (no prefix) -> the STACK screen from anywhere: master or an active chat. Same
# mechanism as C-s/C-p — drop a marker the ghostfleet loop reads on detach, then
# detach; the session keeps running.
#   It lived on C-t until tabs arrived and wanted that key. C-x is the cheapest chord
# left: it is not a readline editing key, so Claude's composer never misses it (unlike
# C-e/C-k/C-w/C-y), and zellij binds nothing to it in normal mode, so it passes through
# without the layout having to unbind anything. `t` is deliberately NOT kept as a
# prefixed alias — C-a t now means the same as C-t, and one key meaning two screens
# depending on whether you held the prefix is exactly the kind of thing you get wrong
# at speed.
#   No unbind is needed for the old C-t / t: both are re-pointed at the tabs below, and
# re-sourcing REPLACES a binding. The unbind trap is for keys this file stops mentioning
# altogether (see C-Left/C-Right further down) — a live server keeps those forever.
bind -n C-x run-shell 'printf stack > "#{socket_path}.goto"' \; detach-client
bind    x   run-shell 'printf stack > "#{socket_path}.goto"' \; detach-client

# TABS — a terminal (C-t) or the editor (C-n) on THIS session's folder, without
# leaving the fleet. Unlike every other chord here these do not detach: the tab is
# another session on the same server, so switch-client moves you there instantly and
# ⇧←/⇧→ (or C-s) brings you back.
#   C-t only reaches tmux because the fleet zellij layout unbinds zellij's own Ctrl-t
# (tab mode); C-n needs the same treatment for zellij's resize mode — see
# layouts/fleet.kdl. Outside that layout, use C-a t / C-a n.
#   NB: C-t is Claude's todo-panel toggle and C-n its history-next, so both are spent
# here. That is the standing trade for every no-prefix binding in this file.
#   #{pane_current_path} and not the worktree from the manifest: if you have cd'd
# somewhere inside the repo, the terminal you asked for is the one where you are.
bind -n C-t run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-tab term "#{socket_path}" "#{pane_current_path}" "#{session_name}"'
bind    t   run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-tab term "#{socket_path}" "#{pane_current_path}" "#{session_name}"'
bind -n C-n run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-tab edit "#{socket_path}" "#{pane_current_path}" "#{session_name}"'
bind    n   run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-tab edit "#{socket_path}" "#{pane_current_path}" "#{session_name}"'

# C-p (no prefix) -> jump all the way up to PROJECTS from anywhere: master or an
# active chat. Drops a "projects" marker the ghostfleet loop reads on detach
# (enter_master + grid_loop both check it), then detaches — the session keeps running.
# NB: like the backtick binding, this takes C-p away from Claude inside a session.
bind -n C-p run-shell 'printf projects > "#{socket_path}.goto"' \; detach-client
bind p run-shell 'printf projects > "#{socket_path}.goto"' \; detach-client

# STEP ALONG THE SESSION RING — master, then the workers in the grid's own order,
# wrapping at both ends (see bin/fleet-cycle):
#   S-Right / S-Left      no prefix              <-- fastest
#   C-a Right / C-a Left  prefixed fallback
# Unlike C-f, this never detaches: both sessions live on the SAME tmux server, so
# switch-client moves the client directly and nothing redraws. (C-f has to go through
# the control plane precisely because it crosses projects = separate servers.)
#
# WHY SHIFT AND NOT CTRL: every no-prefix binding here is stolen from the app, so the
# only question is what you can afford to lose. C-←/C-→ is word-jump in Claude's input
# and you WILL miss it. S-←/S-→ is dead weight in a Claude session, tmux only spends it
# in the prefix table (refresh-client, for oversized clients), and zellij's arrow
# bindings are all Alt-. So this pair costs nothing. C-a is out of the question — it's
# the prefix, and taking it would kill C-a g / d / s / f / p and the C-a C-a escape.
#
# @cf_bin is set by bin/ghostfleet to its absolute bin dir, so the helper resolves
# without trusting the tmux server's inherited PATH; the ?: falls back to PATH if a
# server somehow came up without it being set.
set -g @cf_bin ""
# Re-sourcing this file on a LIVE server ADDS bindings but never removes ones that
# have since been deleted from it. An earlier cut of this feature bound C-Left/C-Right
# in the root table; without these two lines a running fleet would keep swallowing
# Ctrl-←/→ (Claude's word-jump) until its server was killed. Harmless when unset.
unbind -n C-Left
unbind -n C-Right
bind -n S-Right run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-cycle next "#{socket_path}" "#{session_name}"'
bind -n S-Left  run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-cycle prev "#{socket_path}" "#{session_name}"'
bind    Right   run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-cycle next "#{socket_path}" "#{session_name}"'
bind    Left    run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-cycle prev "#{socket_path}" "#{session_name}"'

# MOVE THIS SESSION'S STACK PANE ALONG THE ROW:  C-a <  /  C-a >   (also C-a { / C-a })
#
# The stack (bin/fleet-stack) shows several sessions side by side, one nested tmux client
# per pane, and its own config binds ⌃⇧←/→ for this. Apple Terminal does not send those:
# it drops the modifiers and emits a bare `ESC [ D`, byte-for-byte an unmodified ← — so
# in that terminal the stack's binding is never resolved, and this prefixed pair is the
# one that always arrives. Everything about it is measured in the real three-level nest
# (terminal → stack tmux → fleet tmux → agent), because a binding that never fires looks
# exactly like one that works:
#
#   - C-a reaches HERE from inside a stack pane. The stack runs `prefix None` precisely so
#     it does, which is what keeps C-a g/d/s/p and the C-a C-a escape alive in there too.
#   - the second key may NOT be ⇧←/⇧→, which would have been the prettiest form of all:
#     the stack binds ⇧←→ with -n, so it answers the second key first — the chord moved
#     FOCUS and never got here. A chord through the stack can only use a key the stack
#     leaves alone.
#   - it must be a PREFIXED key, not a `-n` one. Every no-prefix binding in this file is
#     stolen from Claude, and Apple Terminal has nothing spare to spend: ⌃⇧-arrows,
#     ⌥⇧-arrows and ⇧↑/⇧↓ all arrive as the bare arrow, and ⌥←/→ are Claude's word-jump
#     (Terminal sends `ESC b`/`ESC f`). After C-a, Claude sees nothing, so this costs it
#     nothing.
#   - `{`/`}` are tmux's OWN swap-pane-left/right. On a fleet session — one window, one
#     pane — tmux's version has nothing to swap and does nothing, so the same keys doing
#     this instead is strictly more useful, and free for anyone who already knows them.
#
# `#{client_tty}` is what says WHICH pane: tmux resolves it to the client that pressed the
# key, and a stack pane's tty IS that nested client's tty. Pressed in a session that isn't
# in an open stack it matches no pane, and fleet-stack says so rather than quietly
# reordering a stack you are not looking at.
bind '>' run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-stack move right "#{client_tty}"'
bind '<' run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-stack move left  "#{client_tty}"'
bind '}' run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-stack move right "#{client_tty}"'
bind '{' run-shell '#{?#{@cf_bin},#{@cf_bin}/,}fleet-stack move left  "#{client_tty}"'

# INSTA-JUMP, from master or any chat (the numbers are printed on the cards):
#   C-f <p> <s>     -> project p, SESSION s        e.g. C-f 1 1
#   C-f <p> Enter   -> project p's MASTER          (m works too)
#   C-f <p> s       -> project p's session GRID
#   C-f s <p>       -> same grid, short form
#   C-f p           -> the Projects screen
# The project digit can't fire on its own: once "C-f 1 1" must mean project 1 /
# session 1, pressing 1 has to WAIT for what follows — so the lead takes an explicit
# Enter. Each step is a one-shot tmux key table, so nothing reaches Claude's input;
# Escape backs out. Prefixed fallback: C-a f … (identical).
bind -n C-f switch-client -T cfjump \; display-message -d 0 "jump → project? 1-9  ·  s + digit = that project's grid  ·  p = projects  ·  esc"
bind    f   switch-client -T cfjump \; display-message -d 0 "jump → project? 1-9  ·  s + digit = that project's grid  ·  p = projects  ·  esc"
bind -T cfjump 1 switch-client -T cfjump1 \; display-message -d 0 "jump → project 1: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 2 switch-client -T cfjump2 \; display-message -d 0 "jump → project 2: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 3 switch-client -T cfjump3 \; display-message -d 0 "jump → project 3: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 4 switch-client -T cfjump4 \; display-message -d 0 "jump → project 4: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 5 switch-client -T cfjump5 \; display-message -d 0 "jump → project 5: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 6 switch-client -T cfjump6 \; display-message -d 0 "jump → project 6: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 7 switch-client -T cfjump7 \; display-message -d 0 "jump → project 7: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 8 switch-client -T cfjump8 \; display-message -d 0 "jump → project 8: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump 9 switch-client -T cfjump9 \; display-message -d 0 "jump → project 9: session? 1-9  ·  ⏎ or m = master  ·  s = grid  ·  esc"
bind -T cfjump p run-shell 'printf projects > "#{socket_path}.goto"' \; detach-client
bind -T cfjump s switch-client -T cfjumpg \; display-message -d 0 "jump → grid of project? 1-9  ·  esc"
bind -T cfjump Escape switch-client -T root
bind -T cfjumpg 1 run-shell 'printf jump:1 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 2 run-shell 'printf jump:2 > "#{socket_path}.goto"' \; detach-client
bind -T cfjumpg 3 run-shell 'printf jump:3 > "#{socket_path}.goto"' \; detach-client
