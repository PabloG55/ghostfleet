# Always-visible reminder of how to get back to the grid (this is the one thing
# that isn't obvious once you're inside a session). Renders at the bottom of the
# pane, above zellij's own bar.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour236,fg=colour252"
set -g status-left "#[bg=colour148,fg=colour16,bold] ● #S #[bg=colour236,fg=colour148,nobold]▏"
set -g status-left-length 60
# master shows the Ctrl-s / ` shortcuts; workers show the plain back hint.
# (Styles use one attribute per #[...] — a comma inside #[...] would be parsed as
# a #{?...} argument separator and split the conditional.)
set -g status-right "#{?#{==:#S,master},#[fg=colour252]#[bold]Ctrl-s#[fg=colour246]#[nobold] sessions   #[fg=colour252]#[bold]⇧←→#[fg=colour246]#[nobold] cycle   #[fg=colour252]#[bold]Ctrl-f#[fg=colour246]#[nobold] jump   #[fg=colour252]#[bold]\`#[fg=colour246]#[nobold] back to #[fg=colour148]#[bold]Projects  ,#[fg=colour246]press #[fg=colour252]#[bold]\`#[fg=colour246]#[nobold] (or #[fg=colour252]#[bold]Ctrl-a g#[fg=colour246]#[nobold]) to go back  ·  #[fg=colour252]#[bold]⇧←→#[fg=colour246]#[nobold] cycle  ·  #[fg=colour252]#[bold]Ctrl-f#[fg=colour246]#[nobold] jump  }"
set -g status-right-length 110
set -g window-status-format ""
set -g window-status-current-format ""

# Behave well nested + with Claude/vim.
set -g mouse on

# SELECT WITH THE MOUSE = COPIED, the way zellij does it. `mouse on` is what makes this
# necessary: tmux captures the drag, so the terminal's own selection never happens and
# what you highlight lands in tmux's private buffer — visibly selected, and not on the
# clipboard. There was no way to get a URL out of a pane short of holding a modifier to
# bypass tmux entirely, which is not discoverable and differs per terminal.
#   Both copy-mode tables, because which one is active depends on `mode-keys`, which
# follows $EDITOR — bind only copy-mode-vi and it works on a vi user's machine and
# nowhere else. Double/triple click get it too: selecting a word or a line is still
# selecting.
#   set-clipboard on additionally hands the terminal an OSC 52 copy, which is what
# carries the selection back to YOUR machine when the fleet is over SSH — fleet-copy
# runs on the far end, where the clipboard isn't.
#   The command resolves through @cf_bin (as ⇧←→ does) rather than trusting the tmux
# server's PATH; verified that copy-pipe DOES expand formats, and that the selection
# reaches the helper on stdin, before relying on either.
set -g set-clipboard on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
bind -T copy-mode-vi DoubleClick1Pane  send -X select-word \; send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
bind -T copy-mode    DoubleClick1Pane  send -X select-word \; send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
bind -T copy-mode-vi TripleClick1Pane  send -X select-line \; send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
bind -T copy-mode    TripleClick1Pane  send -X select-line \; send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
# ...and from a NORMAL pane, where a double/triple click has to enter copy-mode first.
# `copy-mode -M` starts it at the mouse position; without it the click selects wherever
# the cursor happened to be, which for a terminal at a prompt is the bottom line.
bind -n DoubleClick1Pane copy-mode -M \; send -X select-word \; send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
bind -n TripleClick1Pane copy-mode -M \; send -X select-line \; send -X copy-pipe-and-cancel '#{?#{@cf_bin},#{@cf_bin}/,}fleet-copy'
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"     # truecolor passthrough (zellij -> tmux -> claude)
setw -g aggressive-resize on

# TWO clients on one session — which one decides its size? The stack screen attaches a
# session into a ~50-column pane while you may also be viewing it full screen, and the
# default (window-size latest) hands the decision to whichever attached LAST: open a
# stack, then open that session full screen, and it is cropped to 50 columns with
# nothing on screen to say why. Measured with a 160x45 and a 50x15 client on one
# session: smallest -> 50x14, largest -> 160x44. So the biggest client wins.
#   With one client at a time — every pre-stack fleet flow — latest and largest are
#   identical, so this changes nothing about the old behaviour.
#   bin/fleet-stack ALSO sets this live on each member's server, because a running
#   fleet keeps the options it was born with until this file is re-sourced.
set -g window-size largest

# Keep sessions when you detach; only close a session when its process exits.
set -g destroy-unattached off
set -g remain-on-exit off
