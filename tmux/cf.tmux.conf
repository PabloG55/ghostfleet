# Always-visible reminder of how to get back to the grid (this is the one thing
# that isn't obvious once you're inside a session). Renders at the bottom of the
# pane, above zellij's own bar.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=colour236,fg=colour252"
set -g status-left "#[bg=colour148,fg=colour16,bold] ● #S #[bg=colour236,fg=colour148,nobold]▏"
set -g status-left-length 60
# master shows the Ctrl-s / ` shortcuts; workers show the plain back hint.
# (Styles use one attribute per #[...] — a comma inside #[...] would be parsed as
# a #{?...} argument separator and split the conditional.)
set -g status-right "#{?#{==:#S,master},#[fg=colour252]#[bold]Ctrl-s#[fg=colour246]#[nobold] sessions   #[fg=colour252]#[bold]⇧←→#[fg=colour246]#[nobold] cycle   #[fg=colour252]#[bold]C-f#[fg=colour246]#[nobold] jump   #[fg=colour252]#[bold]\`#[fg=colour246]#[nobold] back to #[fg=colour148]#[bold]Projects  ,#[fg=colour246]press #[fg=colour252]#[bold]\`#[fg=colour246]#[nobold] (or #[fg=colour252]#[bold]Ctrl-a g#[fg=colour246]#[nobold]) to go back  ·  #[fg=colour252]#[bold]⇧←→#[fg=colour246]#[nobold] cycle  ·  #[fg=colour252]#[bold]C-f#[fg=colour246]#[nobold] jump  }"
set -g status-right-length 110
set -g window-status-format ""
set -g window-status-current-format ""

# Behave well nested + with Claude/vim.
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"     # truecolor passthrough (zellij -> tmux -> claude)
setw -g aggressive-resize on

# Keep sessions when you detach; only close a session when its process exits.
set -g destroy-unattached off
set -g remain-on-exit off
